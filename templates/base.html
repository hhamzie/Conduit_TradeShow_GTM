<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title if title else "Trade Show Outbound" }}</title>
    <link rel="stylesheet" href="/static/styles.css" />
    <script src="/static/app.js" defer></script>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div>
          <a class="brand" href="/">{{ app_name if app_name else "Trade Show Outbound" }}</a>
          <p class="tagline">Single-show scraping, bulk scrape bundles, and Clay-to-Smartlead automation in one cleaner workflow.</p>
        </div>
        {% if request.session.get("authenticated") %}
        <form action="/logout" method="post">
          <button type="submit" class="button secondary">Log Out</button>
        </form>
        {% endif %}
      </header>
      <main>
        {% block content %}{% endblock %}
      </main>
    </div>
  </body>
</html>
