name: CI

on:
  push:
    branches:
      - main
      - feature/clay-smartlead-automation
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile application
        run: python -m compileall app tests

      - name: Run show intelligence tests
        run: python -m unittest -v tests.test_show_intelligence

      - name: Run workflow presenter tests
        run: python -m unittest -v tests.test_workflow_presenters

      - name: Run guide sheet tests
        run: python -m unittest -v tests.test_show_guides

      - name: Run automation tests
        run: python -m unittest -v tests.test_automation

      - name: Smoke test production app
        run: sh scripts/smoke-production.sh

      - name: Build Render image
        run: docker build -t hpointscraper-ci .
